<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imperia — 世界史の版図を現代地図に重ねる</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.5.0/dist/maplibre-gl.css">
<style>
  :root {
    --panel-w: 320px;
    --bar-h: 64px;
    --ink: #1c1c1e;
    --bg: #ffffff;
    --line: #d8d8dc;
    --muted: #6b6b70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  #map { position: absolute; inset: 0 var(--panel-w) var(--bar-h) 0; }

  /* --- 右パネル --- */
  #panel {
    position: absolute;
    top: 0; right: 0; bottom: var(--bar-h);
    width: var(--panel-w);
    border-left: 1px solid var(--line);
    background: var(--bg);
    padding: 20px;
    overflow-y: auto;
  }
  #panel h1 {
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
  }
  .panel-hint { color: var(--muted); font-size: 13px; line-height: 1.7; }
  .panel-name { font-size: 22px; margin: 0 0 2px; line-height: 1.3; }
  .panel-name-en { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .panel-facts { margin: 16px 0 0; font-size: 14px; }
  .panel-facts dt {
    color: var(--muted); font-size: 11px; letter-spacing: .06em;
    margin-top: 14px; font-weight: 600;
  }
  .panel-facts dd { margin: 4px 0 0; line-height: 1.6; }

  #borders-toggle {
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }

  /* --- 下部バー --- */
  #bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--bar-h);
    border-top: 1px solid var(--line);
    background: var(--bg);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
  }
  #play {
    flex: none;
    width: 38px; height: 38px;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--bg); cursor: pointer;
    font-size: 14px; line-height: 1;
  }
  #play:hover { background: #f4f4f6; }
  #era-slider { flex: 1; min-width: 0; }
  .bar-end { flex: none; font-size: 12px; color: var(--muted); }
  #year-label {
    flex: none; min-width: 130px; text-align: right;
    font-size: 18px; font-variant-numeric: tabular-nums;
  }
  #loading { flex: none; font-size: 12px; color: var(--muted); min-width: 56px; }

  /* --- トースト（ロード失敗） --- */
  #toast {
    position: absolute;
    left: 50%; bottom: calc(var(--bar-h) + 20px);
    transform: translateX(-50%);
    background: #2b2b2e; color: #fff;
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; display: none;
    align-items: center; gap: 12px;
  }
  #toast button {
    background: #4a4a50; color: #fff; border: 0;
    padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
  }
</style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <h1>imperia</h1>
    <div id="panel-body"></div>
    <label id="borders-toggle">
      <input type="checkbox" id="borders-checkbox" checked>
      現代の国境を表示
    </label>
  </aside>

  <div id="bar">
    <button id="play" title="自動再生">▶</button>
    <span class="bar-end">紀元前3000年</span>
    <input type="range" id="era-slider" min="0" max="47" step="1" value="0" aria-label="年代">
    <span class="bar-end">2010年</span>
    <span id="loading"></span>
    <span id="year-label">紀元前3000年</span>
  </div>

  <div id="toast">
    <span id="toast-msg"></span>
    <button id="toast-retry">再試行</button>
  </div>

  <!-- MapLibre GL JS v6 は ESM のみ配布（UMD ビルドは無い）ため app.js 側で import する -->
  <script type="module" src="./app.js"></script>
</body>
</html>
