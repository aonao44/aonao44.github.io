<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imperia — 世界史の版図を現代地図に重ねる</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.5.0/dist/maplibre-gl.css">
<style>
  :root {
    --panel-w: 320px;
    --bar-h: 64px;
    --ink: #1c1c1e;
    --bg: #ffffff;
    --line: #d8d8dc;
    --muted: #6b6b70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  #map { position: absolute; inset: 0 var(--panel-w) var(--bar-h) 0; }

  /* --- 右パネル --- */
  #panel {
    position: absolute;
    top: 0; right: 0; bottom: var(--bar-h);
    width: var(--panel-w);
    border-left: 1px solid var(--line);
    background: var(--bg);
    padding: 20px;
    overflow-y: auto;
    /* MapLibre のコントロール(帰属表示・ズーム)より前に出す。
       モバイルではシートが地図に重なるため、これが無いと帰属表示が本文に被る */
    z-index: 5;
  }
  #panel h1 {
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
  }
  .panel-hint { color: var(--muted); font-size: 13px; line-height: 1.7; }
  .panel-name { font-size: 22px; margin: 0 0 2px; line-height: 1.3; }
  .panel-name-en { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .panel-facts { margin: 16px 0 0; font-size: 14px; }
  .panel-facts dt {
    color: var(--muted); font-size: 11px; letter-spacing: .06em;
    margin-top: 14px; font-weight: 600;
  }
  .panel-facts dd { margin: 4px 0 0; line-height: 1.6; }

  #borders-toggle {
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }

  /* --- 下部バー --- */
  #bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--bar-h);
    border-top: 1px solid var(--line);
    background: var(--bg);
    display: grid;
    grid-template-columns: auto minmax(80px, 1fr) auto 108px minmax(0, auto) auto;
    grid-template-areas: "start slider finish jump status year";
    align-items: center; gap: 16px;
    padding: 0 20px;
    z-index: 6;
  }
  .bar-start { grid-area: start; }
  .bar-finish { grid-area: finish; }
  #year-jump { grid-area: jump; position: relative; width: 108px; min-width: 0; }
  #year-input {
    width: 108px;
    padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink);
    font: inherit; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  #year-input::placeholder { color: #a5a5aa; }
  #year-input:focus-visible {
    outline: none;
    border-color: #2f6fd0;
    box-shadow: 0 0 0 3px rgba(47, 111, 208, .15);
  }
  #year-input.is-invalid {
    border-color: #c0392b;
    box-shadow: 0 0 0 3px rgba(192, 57, 43, .12);
  }
  #year-hint {
    position: absolute;
    right: 20px;
    bottom: calc(100% + 10px);
    max-width: calc(100vw - 40px);
    padding: 6px 9px;
    border-radius: 6px;
    background: rgba(255, 255, 255, .96);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
    font-size: 12px; color: var(--muted);
    white-space: normal;
  }
  #year-hint:empty { display: none; }
  #era-slider { grid-area: slider; width: 100%; min-width: 0; }
  .bar-end { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #year-label {
    grid-area: year; min-width: 130px; text-align: right; white-space: nowrap;
    font-size: 18px; font-variant-numeric: tabular-nums;
  }
  #loading {
    grid-area: status; min-width: 0; font-size: 12px; color: var(--muted);
    white-space: nowrap;
  }

  /* --- トースト（ロード失敗） --- */
  #toast {
    position: absolute;
    left: 50%; bottom: calc(var(--bar-h) + 20px);
    transform: translateX(-50%);
    background: #2b2b2e; color: #fff;
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; display: none;
    align-items: center; gap: 12px;
    z-index: 7;
  }
  #toast button {
    background: #4a4a50; color: #fff; border: 0;
    padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
  }
  #toast button:hover { background: #5b5b62; }

  /* --- 凡例 --- */
  #legend {
    position: absolute;
    left: 12px; bottom: calc(var(--bar-h) + 12px);
    z-index: 4;
    max-width: 330px;
    background: rgba(255, 255, 255, .93);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px;
    font-size: 11.5px; line-height: 1.55; color: #4b4b50;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .07);
  }
  #legend-toggle {
    display: none;
    background: none; border: 0; padding: 0;
    font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  #legend-body { list-style: none; margin: 0; padding: 0; }
  #legend-body li {
    display: flex; align-items: flex-start; gap: 7px;
    margin-top: 5px;
  }
  #legend-body li:first-child { margin-top: 0; }
  .lg-swatch {
    flex: none; width: 13px; height: 13px; margin-top: 2px; border-radius: 3px;
    background: hsl(28, 68%, 52%); opacity: .55;
    border: 1px solid hsl(28, 72%, 28%);
  }
  /* 非国家は無彩色。src/layers.js の NONSTATE_SAT = 0 に合わせる */
  .lg-swatch.lg-faint { background: hsl(0, 0%, 52%); opacity: .15; border-color: #9a9aa0; }
  .lg-dot {
    flex: none; width: 11px; height: 11px; margin-top: 3px; border-radius: 50%;
    background: #fdf6e3; border: 2px solid #1c1c1e;
  }
  .lg-line {
    flex: none; width: 15px; height: 0; margin-top: 8px;
    border-top: 1px solid #2b2b2e;
  }
  /* 海。app.js の WATER_FILL_COLOR と同じ色にしておく */
  .lg-sea {
    flex: none; width: 13px; height: 13px; margin-top: 2px; border-radius: 3px;
    background: hsl(205, 62%, 78%); border: 1px solid hsl(205, 45%, 62%);
  }

  #year-format-hint {
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    width: max-content;
    max-width: calc(100vw - 28px);
    padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 6px;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    font-size: 10.5px; line-height: 1.45; color: var(--muted);
    white-space: normal;
    opacity: 0;
    pointer-events: none;
  }
  #year-jump:focus-within #year-format-hint { opacity: 1; }

  /* --- この時代の世界（概説） --- */
  .overview {
    margin: 14px 0 0;
    padding: 12px 13px;
    background: #f7f7f9;
    border-radius: 8px;
  }
  .overview-title {
    margin: 0 0 6px;
    font-size: 11px; letter-spacing: .06em; font-weight: 600;
    color: var(--muted);
  }
  .overview-body {
    margin: 0;
    font-size: 12.5px; line-height: 1.85; color: #3a3a3e;
  }
  .topics-title {
    margin: 20px 0 0;
    font-size: 11px; letter-spacing: .06em; font-weight: 600;
    color: var(--muted);
  }

  /* --- 政体の来歴 --- */
  .polity-period {
    margin: 10px 0 0;
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .polity-summary {
    margin: 8px 0 0;
    font-size: 12.5px; line-height: 1.85; color: #3a3a3e;
  }

  /* --- 登場する断面 --- */
  .era-jump {
    margin: 14px 0 0; padding: 10px 12px;
    background: #f7f7f9; border-radius: 8px;
  }
  .era-jump-label {
    margin: 0 0 8px; font-size: 11.5px; color: #4b4b50;
    font-variant-numeric: tabular-nums;
  }
  .era-jump-buttons { display: flex; gap: 6px; }
  .era-jump-btn {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
    font: inherit; font-size: 11.5px; cursor: pointer;
    white-space: nowrap;
  }
  .era-jump-btn:hover:not(:disabled) { background: #eef2f9; border-color: #2f6fd0; color: #2f6fd0; }
  .era-jump-btn:disabled { opacity: .38; cursor: default; }

  /* --- トピック一覧 --- */
  .topics { list-style: none; margin: 12px 0 0; padding: 0; }
  .topic { padding: 12px 0; border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; padding-top: 4px; }
  .topic-btn, .topic-static {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 0; font: inherit;
  }
  .topic-btn { cursor: pointer; }
  .topic-btn:hover .topic-title { text-decoration: underline; }
  .topic-title {
    display: block; font-size: 14px; font-weight: 600; line-height: 1.5;
    color: var(--ink);
  }
  .topic-polity {
    display: inline-block; margin-top: 3px;
    font-size: 11px; color: #2f6fd0;
  }
  .topic-polity::before { content: '▸ '; }
  .topic-body { margin: 5px 0 0; font-size: 12.5px; line-height: 1.7; color: #4b4b50; }
  .topic-source { margin: 4px 0 0; font-size: 11px; }
  .topic-source a { color: var(--muted); }

  .panel-back {
    display: block; margin: 0 0 14px; padding: 0;
    background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 12px; color: #2f6fd0;
  }
  .panel-back:hover { text-decoration: underline; }

  :where(button, a, input):focus-visible {
    outline: 2px solid #2f6fd0;
    outline-offset: 3px;
  }

  /* 出来事パネル */
  .panel-kicker {
    margin: 0 0 4px; font-size: 12px; color: var(--muted);
    letter-spacing: .06em; font-variant-numeric: tabular-nums;
  }
  .panel-summary { margin: 12px 0 0; font-size: 14px; line-height: 1.75; }
  .panel-source { margin: 16px 0 0; font-size: 13px; }
  .panel-source a { color: #2f6fd0; }

  /* デスクトップでは閉じるボタンもシートのハンドルも不要 */
  #sheet-close { display: none; }
  #sheet-handle { display: none; }

  /* --- モバイル: パネルを下からのシートにする --- */
  @media (max-width: 767px) {
    :root { --bar-h: 88px; --sheet-handle-h: 44px; }

    #map { inset: 0 0 var(--bar-h) 0; }

    #panel {
      top: auto; right: 0; left: 0;
      bottom: var(--bar-h);
      width: auto;
      max-height: 55vh;
      border-left: 0;
      border-top: 1px solid var(--line);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, .12);
      padding: 20px 20px 24px;
      /* 既定ではハンドルの高さぶんだけ見せておく。
         「この時代のトピック」を押すと開く */
      transform: translateY(calc(100% - var(--sheet-handle-h)));
      transition: transform .22s ease;
    }
    #panel.is-open { transform: translateY(0); }
    #sheet-handle { display: block; }

    #sheet-handle {
      width: 100%;
      height: var(--sheet-handle-h);
      margin: -20px 0 4px;
      background: none; border: 0;
      font: inherit; font-size: 13px; font-weight: 600;
      color: var(--ink); cursor: pointer; text-align: left;
    }
    #sheet-handle::after { content: ' ▴'; color: var(--muted); }
    #panel.is-open #sheet-handle::after { content: ' ▾'; }

    #sheet-close {
      display: block;
      position: absolute; top: 10px; right: 12px;
      width: 32px; height: 32px;
      border: 0; border-radius: 50%;
      background: #f0f0f3; color: var(--ink);
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    #panel:not(.is-open) #sheet-close { visibility: hidden; }

    #panel h1 { display: none; }

    /* 下部バーは 2 段にしてスライダーに幅を与える（タッチ操作のため） */
    #bar {
      grid-template-columns: 92px minmax(0, 1fr) auto;
      grid-template-rows: 32px 32px;
      grid-template-areas:
        "jump status year"
        "start slider finish";
      gap: 6px 8px;
      padding: 8px 10px;
    }
    #era-slider {
      /* 指で掴めるだけの高さを確保する */
      height: 32px;
    }
    /* モバイルでは凡例を左上（ズームコントロールの下）に移す。
       下に置くとシートを開いた時に覆われて読めなくなり、畳んでいても
       「この時代のトピック」ハンドルと取り合いになるため。 */
    #legend {
      top: 96px; bottom: auto;
      left: 8px; right: auto;
      max-width: calc(100% - 16px);
      padding: 7px 10px;
    }
    #legend-toggle { display: block; }
    #legend-toggle::after { content: ' ▸'; }
    /* 既定は畳んだ状態。開いた時だけ本体を出す */
    #legend-body { display: none; margin-top: 7px; }
    #legend.is-expanded #legend-body { display: block; }
    #legend.is-expanded #legend-toggle::after { content: ' ▾'; }

    .bar-end { font-size: 10px; }
    #year-input { width: 92px; }
    #year-format-hint { left: 0; right: auto; width: calc(100vw - 20px); }
    #year-hint { right: 10px; max-width: calc(100vw - 20px); font-size: 11px; }
    #year-label { min-width: 0; font-size: 14px; }
    #loading { overflow: hidden; text-overflow: ellipsis; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    #panel { transition: none; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" aria-label="時代と政体の詳細">
    <button id="sheet-handle" aria-expanded="false" aria-controls="sheet-content">この時代のトピック</button>
    <div id="sheet-content">
      <button id="sheet-close" aria-label="詳細シートを閉じる">×</button>
      <h1>imperia</h1>
      <div id="panel-body"></div>
      <label id="borders-toggle">
        <input type="checkbox" id="borders-checkbox" checked>
        現代の国境を表示
      </label>
    </div>
  </aside>

  <div id="bar">
    <span class="bar-end bar-start">紀元前3000年</span>
    <input type="range" id="era-slider" min="0" max="47" step="1" value="0" aria-label="年代">
    <span class="bar-end bar-finish">2010年</span>
    <label id="year-jump">
      <input type="text" id="year-input" name="year" inputmode="text" autocomplete="off"
             placeholder="年で移動…" aria-label="年を入力して移動" aria-invalid="false"
             aria-describedby="year-format-hint year-hint">
      <span id="year-format-hint">紀元前は「紀元前500」「-500」「BC500」など（紀元前0年はありません）</span>
    </label>
    <span id="loading" role="status" aria-live="polite"></span>
    <span id="year-hint" role="status" aria-live="polite" aria-atomic="true"></span>
    <span id="year-label">紀元前3000年</span>
  </div>

  <div id="legend">
    <button id="legend-toggle" aria-expanded="false" aria-controls="legend-body">凡例</button>
    <ul id="legend-body">
      <li><span class="lg-swatch"></span>色 = 政体ごとの識別色（意味はなく、同じ政体は年代をまたいで同じ色）</li>
      <li><span class="lg-sea"></span>青 = 海。青は海だけに使い、政体には割り当てない（斜体の地名が海洋名）</li>
      <li><span class="lg-swatch lg-faint"></span>灰色の薄い文字/塗り = 国家でない文化圏（狩猟採集民・部族など）。色が付くのは政体だけ</li>
      <li><span class="lg-dot"></span>○ = 出来事（クリックで詳細）</li>
      <li><span class="lg-line"></span>細い線 = 現代の国境</li>
    </ul>
  </div>

  <div id="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <span id="toast-msg"></span>
    <button id="toast-retry">再試行</button>
  </div>

  <!-- MapLibre GL JS v6 は ESM のみ配布（UMD ビルドは無い）ため app.js 側で import する -->
  <script type="module" src="./app.js"></script>
</body>
</html>
